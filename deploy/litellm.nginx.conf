# include inside the fsmaster.com server {} block (443)
location ^~ /litellm/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;          # streamable http / sse
    proxy_read_timeout 3600s;
}
# MCP clients do RFC 9728 / RFC 8414 discovery at the ROOT of the host,
# e.g. /.well-known/oauth-protected-resource/litellm/sentry/mcp
location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:4010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:4010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
